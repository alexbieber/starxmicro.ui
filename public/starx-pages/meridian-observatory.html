<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meridian Observatory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #07080c; color: #f4f1ea; overflow: hidden; }
    body { font-family: "IBM Plex Mono", monospace; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .stage {
      position: relative; z-index: 2; height: 100%;
      display: grid; place-items: center; text-align: center; padding: 6vh 6vw;
    }
    .rings {
      position: absolute; inset: 12%; margin: auto; width: min(72vh, 72vw); height: min(72vh, 72vw);
      pointer-events: none;
    }
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid rgba(232, 195, 122, 0.18);
      animation: spin 48s linear infinite;
    }
    .ring:nth-child(2) { inset: 9%; animation-duration: 72s; animation-direction: reverse; border-color: rgba(232, 195, 122, 0.28); }
    .ring:nth-child(3) { inset: 18%; animation-duration: 36s; border-style: dashed; }
    .ring:nth-child(4) {
      inset: 31%; border: 0; background:
        conic-gradient(from 90deg, transparent 0 86%, #e8c37a 0 88%, transparent 0);
      animation-duration: 22s;
    }
    .tick {
      position: absolute; left: 50%; top: 0; width: 1px; height: 14px; background: #e8c37a;
      transform-origin: 50% min(36vh, 36vw);
    }
    h1 {
      font-family: "Cormorant Garamond", serif; font-size: clamp(3.6rem, 10vw, 8rem);
      font-weight: 400; letter-spacing: -0.04em; line-height: 0.86;
    }
    h1 span { display: block; font-style: italic; color: #e8c37a; font-size: 0.42em; letter-spacing: 0.28em; margin-bottom: 18px; }
    p { margin-top: 22px; max-width: 38ch; color: #8e8a80; font-size: 12px; line-height: 1.8; letter-spacing: 0.04em; }
    .hud {
      position: absolute; left: 28px; right: 28px; bottom: 28px; z-index: 3;
      display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; color: #8e8a80;
    }
    .hud b { color: #e8c37a; font-weight: 500; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="rings">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>
  <div class="stage">
    <div>
      <h1><span>Night instrument</span>Meridian</h1>
      <p>A northern observatory hero: gold meridians, a slow star field, and coordinates that drift with the pointer like a live catalog of the sky.</p>
    </div>
  </div>
  <div class="hud">
    <span>RA <b id="ra">14h 39m</b></span>
    <span>Dec <b id="dec">+19° 10′</b></span>
    <span>Alt <b id="alt">41.2°</b></span>
  </div>
  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    let stars = [];
    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      stars = Array.from({ length: 160 }, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.4,
        a: 0.25 + Math.random() * 0.7,
        tw: Math.random() * Math.PI * 2,
      }));
    }
    function draw(t) {
      ctx.fillStyle = "#07080c";
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      stars.forEach((s) => {
        ctx.beginPath();
        ctx.fillStyle = `rgba(244,241,234,${s.a * (0.55 + Math.sin(t / 700 + s.tw) * 0.45)})`;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    const ra = document.getElementById("ra");
    const dec = document.getElementById("dec");
    const alt = document.getElementById("alt");
    addEventListener("pointermove", (event) => {
      const x = event.clientX / innerWidth;
      const y = event.clientY / innerHeight;
      ra.textContent = `${String(Math.floor(x * 24)).padStart(2, "0")}h ${String(Math.floor(y * 60)).padStart(2, "0")}m`;
      dec.textContent = `${y > 0.5 ? "-" : "+"}${Math.floor(Math.abs(0.5 - y) * 80)}° ${Math.floor(x * 60)}′`;
      alt.textContent = `${(18 + (1 - y) * 62).toFixed(1)}°`;
      document.querySelector(".rings").style.transform = `rotateX(${(0.5 - y) * 12}deg) rotateY(${(x - 0.5) * 14}deg)`;
    });
    addEventListener("resize", resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
